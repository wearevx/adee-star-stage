<style>
/* Layout: one phone-sized column, a theatre marquee on top, Jenny's voice bubble pinned to the bottom. */
:root {
  color-scheme: light;
  --bg: #FFF5F9;
  --paper: #FFFFFF;
  --ink: #3A1E47;
  --muted: #76627F;
  --line: #F1DCE8;
  --velvet: #9B2C5A;
  --velvet-deep: #651A3C;
  --gold: #F4B740;
  --gold-deep: #C98A12;
  --gold-soft: #FFF1C9;
  --mint: #16A08C;
  --mint-deep: #0E7666;
  --sky: #4F86E8;
  --sky-deep: #2F62BD;
  --rose: #F06C9B;
  --stage: #2B1736;
  --stage-ink: #FFF1C9;
  --skin: #F5CDB2;
  --hair: #5A3424;
  --gown: #E9A6D2;
  --font-display: 'Fredoka', 'Nunito', ui-rounded, system-ui, sans-serif;
  --font-body: 'Nunito', ui-rounded, system-ui, sans-serif;
  --font-py: 'Andika', 'Nunito', system-ui, sans-serif;
  --font-zh: 'Noto Sans SC', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 17px; line-height: 1.45;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }
.app {
  max-width: 480px; margin: 0 auto; min-height: 100%;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 140px;
  display: flex; flex-direction: column; gap: 16px;
}

/* ---------- top bar ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  display: flex; align-items: center; gap: 10px;
  padding-block: 10px; background: var(--bg);
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.back {
  width: 48px; height: 48px; border-radius: 16px; border: 2px solid var(--line);
  background: var(--paper); font-size: 22px; display: grid; place-items: center;
  box-shadow: 0 3px 0 var(--line);
}
.topbar .where { flex: 1; min-width: 0; font-family: var(--font-display); font-weight: 600; font-size: 19px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.purse {
  display: flex; align-items: center; gap: 8px; padding: 6px 12px 6px 8px;
  background: var(--gold-soft); border: 2px solid var(--gold); border-radius: 999px;
  font-family: var(--font-display); font-weight: 700; font-size: 19px; font-variant-numeric: tabular-nums;
}
.purse .star { font-size: 22px; line-height: 1; }
.purse .sp { display: flex; gap: 3px; }
.purse .sp i { width: 7px; height: 7px; border-radius: 50%; background: #fff; border: 1.5px solid var(--gold-deep); }
.purse .sp i.on { background: var(--gold-deep); }
.purse.bump { animation: bump .5s ease; }
@keyframes bump { 40% { transform: scale(1.18); } }

/* ---------- marquee ---------- */
.marquee {
  background: var(--velvet); color: var(--gold-soft); border-radius: 22px;
  padding: 20px 18px 18px; position: relative; overflow: hidden; text-align: center;
  box-shadow: inset 0 0 0 6px var(--velvet-deep);
}
.marquee::before, .marquee::after {
  content: ""; position: absolute; left: 14px; right: 14px; height: 10px;
  background: radial-gradient(circle, #FFE9A8 0 3px, transparent 3.5px) 0 0 / 18px 10px repeat-x;
  animation: bulbs 1.6s steps(2) infinite;
}
.marquee::before { top: 8px; } .marquee::after { bottom: 8px; animation-delay: .8s; }
@keyframes bulbs { 50% { opacity: .45; } }
.marquee h1 { margin: 6px 0 2px; font-family: var(--font-display); font-weight: 700; font-size: clamp(30px, 9vw, 40px); line-height: 1.05; letter-spacing: .5px; text-wrap: balance; }
.marquee p { margin: 0 0 6px; font-weight: 700; color: #FFD7E6; font-size: 15px; letter-spacing: .4px; }

/* ---------- ticket ---------- */
.ticket {
  display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px;
  background: var(--gold-soft); border: 2px dashed var(--gold-deep); border-radius: 16px; padding: 12px 16px;
}
.ticket .k { font-size: 12px; font-weight: 800; letter-spacing: 1.4px; text-transform: uppercase; color: var(--gold-deep); }
.ticket .v { font-family: var(--font-display); font-weight: 600; font-size: 18px; }
.ticket .num { font-family: var(--font-display); font-weight: 700; font-size: 34px; line-height: 1; text-align: center; color: var(--velvet); font-variant-numeric: tabular-nums; }
.ticket .num small { display: block; font-size: 12px; font-family: var(--font-body); font-weight: 800; color: var(--muted); letter-spacing: .6px; }

/* ---------- Jenny on stage (home) ---------- */
.jstage {
  display: grid; grid-template-columns: 132px 1fr; gap: 12px; align-items: end;
  background: linear-gradient(180deg, #FCE6F0 0%, var(--paper) 70%); border: 2px solid var(--line);
  border-radius: 22px; padding: 12px 14px 0;
}
.jstage svg { width: 132px; height: auto; display: block; }
.jstage .bubble { margin-bottom: 18px; }
.bubble {
  background: var(--paper); border: 2px solid var(--line); border-radius: 18px; padding: 12px 14px;
  font-weight: 700; font-size: 16px; position: relative; min-width: 0;
}
.bubble::after {
  content: ""; position: absolute; left: -10px; bottom: 16px; width: 16px; height: 16px; background: var(--paper);
  border-left: 2px solid var(--line); border-bottom: 2px solid var(--line); transform: rotate(45deg);
}

/* ---------- cards / sections ---------- */
.card { background: var(--paper); border: 2px solid var(--line); border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card h2 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 21px; text-wrap: balance; }
.eyebrow { font-size: 12px; font-weight: 800; letter-spacing: 1.4px; text-transform: uppercase; color: var(--velvet); }
.muted { color: var(--muted); }

/* ---------- buttons ---------- */
.btn {
  border: 0; border-radius: 18px; padding: 14px 20px; min-height: 56px;
  font-family: var(--font-display); font-weight: 600; font-size: 19px;
  background: var(--mint); color: #fff; box-shadow: 0 5px 0 var(--mint-deep);
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  transition: transform .08s, box-shadow .08s;
}
.btn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--mint-deep); }
.btn.gold { background: var(--gold); color: var(--ink); box-shadow: 0 5px 0 var(--gold-deep); }
.btn.gold:active { box-shadow: 0 2px 0 var(--gold-deep); }
.btn.sky { background: var(--sky); box-shadow: 0 5px 0 var(--sky-deep); }
.btn.sky:active { box-shadow: 0 2px 0 var(--sky-deep); }
.btn.velvet { background: var(--velvet); box-shadow: 0 5px 0 var(--velvet-deep); }
.btn.velvet:active { box-shadow: 0 2px 0 var(--velvet-deep); }
.btn.ghost { background: var(--paper); color: var(--ink); border: 2px solid var(--line); box-shadow: 0 4px 0 var(--line); }
.btn.ghost:active { box-shadow: 0 1px 0 var(--line); }
.btn.wide { width: 100%; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.row { display: flex; gap: 12px; flex-wrap: wrap; }
.row > .btn { flex: 1 1 140px; }
.pulse { animation: pulse 1.3s ease-in-out infinite; }
@keyframes pulse { 50% { transform: scale(1.06); } }

/* ---------- mission ---------- */
.mission { background: var(--paper); border: 2px solid var(--gold); border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.mission h2 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 21px; }
.task {
  display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center;
  border: 2px solid var(--line); border-radius: 16px; padding: 10px 12px; background: var(--bg); text-align: left; width: 100%;
}
.task .ic { font-size: 28px; text-align: center; }
.task .t { font-family: var(--font-display); font-weight: 600; font-size: 18px; line-height: 1.2; }
.task .s { font-size: 13px; color: var(--muted); font-weight: 700; }
.task .tick { width: 30px; height: 30px; border-radius: 50%; border: 2.5px solid var(--line); display: grid; place-items: center; font-size: 16px; }
.task.done { border-color: var(--mint); }
.task.done .tick { background: var(--mint); border-color: var(--mint); color: #fff; }

/* ---------- tiles ---------- */
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.tile {
  border: 2px solid var(--line); border-radius: 20px; background: var(--paper); padding: 14px 12px 12px;
  display: flex; flex-direction: column; align-items: center; gap: 4px; box-shadow: 0 4px 0 var(--line); min-height: 112px; justify-content: center;
}
.tile:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.tile .ic { font-size: 40px; line-height: 1.1; }
.tile .t { font-family: var(--font-display); font-weight: 600; font-size: 18px; text-align: center; line-height: 1.15; }
.tile.wide { grid-column: 1 / -1; flex-direction: row; gap: 14px; min-height: 0; background: var(--stage); color: var(--stage-ink); border-color: var(--stage); box-shadow: 0 4px 0 #160A1C; }
.linkish { background: none; border: 0; color: var(--muted); font-weight: 800; text-decoration: underline; text-underline-offset: 3px; padding: 12px; align-self: center; }

/* ---------- Jenny voice bar ---------- */
.voicebar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  pointer-events: none; display: flex; justify-content: center;
}
.voicebar .in {
  pointer-events: auto; max-width: 480px; width: 100%;
  display: grid; grid-template-columns: 56px 1fr; gap: 10px; align-items: center;
  background: var(--paper); border: 2px solid var(--velvet); border-radius: 22px; padding: 8px 12px 8px 8px;
  box-shadow: 0 8px 24px rgba(101, 26, 60, .18);
  transform: translateY(130%); transition: transform .25s ease;
}
.voicebar.show .in { transform: none; }
.voicebar .face { width: 56px; height: 56px; border-radius: 50%; overflow: hidden; background: #FCE6F0; }
.voicebar .face svg { width: 100%; height: 100%; }
.voicebar .txt { font-weight: 700; font-size: 15.5px; line-height: 1.3; min-width: 0; }
.voicebar.talking .face { animation: talk .35s ease-in-out infinite alternate; }
@keyframes talk { to { transform: scale(1.06) rotate(-2deg); } }

/* ---------- map ---------- */
.mood { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-weight: 800; font-size: 13px; background: var(--bg); border: 2px solid var(--line); align-self: flex-start; }
.stones { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.stone {
  aspect-ratio: 1; max-width: 100%; border-radius: 20px; border: 2px solid var(--line); background: var(--bg);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; position: relative; padding: 4px;
}
.stone .pic { font-size: 30px; line-height: 1; }
.stone .no { position: absolute; top: 4px; left: 8px; font-size: 12px; font-weight: 800; color: var(--muted); }
.stone .st { font-size: 11px; letter-spacing: 1px; color: var(--line); }
.stone .st b { color: var(--gold-deep); font-weight: 400; }
.stone.next { border-color: var(--gold); box-shadow: 0 0 0 4px var(--gold-soft); animation: pulse 1.6s ease-in-out infinite; }
.stone.master { background: var(--gold-soft); border-color: var(--gold); }
.minirow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.minibtn { border: 2px solid var(--line); background: var(--paper); border-radius: 14px; padding: 10px 4px; font-family: var(--font-display); font-weight: 600; font-size: 14.5px; line-height: 1.15; display: flex; flex-direction: column; align-items: center; gap: 2px; box-shadow: 0 3px 0 var(--line); }
.minibtn .ic { font-size: 22px; }
.minibtn.done { border-color: var(--mint); }

/* ---------- practice ---------- */
.steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.steps button { border: 2px solid var(--line); }
.pnav { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; }
.pnav .pn { font-size: 13px; font-weight: 800; color: var(--muted); text-align: center; }
.pnav #pNextP { justify-self: end; }
.btn.sm { min-height: 40px; padding: 6px 12px; font-size: 15px; border-radius: 14px; box-shadow: 0 3px 0 var(--line); }
.steps span, .steps button { text-align: center; font-size: 13px; font-weight: 800; padding: 6px 4px; border-radius: 999px; background: var(--paper); border: 2px solid var(--line); color: var(--muted); }
.steps button.on, .steps span.on { background: var(--velvet); border-color: var(--velvet); color: #fff; }
.steps button.done, .steps span.done { border-color: var(--mint); color: var(--mint-deep); }
.bigpic { font-size: 92px; line-height: 1; text-align: center; padding: 8px 0 0; filter: drop-shadow(0 6px 0 rgba(58, 30, 71, .08)); }
.bigpic.pop { animation: popin .45s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes popin { from { transform: scale(.5); opacity: 0; } }
.phrase { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 4px; padding: 4px 0; }
.word { border: 0; background: transparent; border-radius: 12px; padding: 2px 3px; display: inline-flex; gap: 2px; }
.word:active, .word.hear { background: var(--gold-soft); }
.syl { display: inline-flex; flex-direction: column; align-items: center; min-width: 1.9em; transition: color .12s, transform .12s; }
.syl .p { font-family: var(--font-py); font-size: 15px; color: var(--muted); line-height: 1.1; white-space: nowrap; }
.syl .z { font-family: var(--font-zh); font-weight: 700; font-size: 34px; line-height: 1.15; color: var(--ink); }
.syl.en .z { font-family: var(--font-display); font-size: 26px; padding-top: 4px; }
.syl.now .z, .syl.now .p { color: var(--velvet); }
.syl.now { transform: translateY(-3px) scale(1.12); }
.syl.sung .z { color: var(--velvet); }
.syl.sung .p { color: var(--velvet); }
.phrase.hidden .syl:not(.sung):not(.now) .z, .phrase.hidden .syl:not(.sung):not(.now) .p { color: transparent; }
.phrase.hidden .syl:not(.sung):not(.now) .z { background: var(--line); border-radius: 8px; }
.meaning { text-align: center; font-weight: 800; font-size: 17px; margin: 0; }
.move { text-align: center; margin: 0; font-size: 15px; color: var(--muted); font-weight: 700; }
.mic {
  width: 132px; height: 132px; border-radius: 50%; border: 0; align-self: center;
  background: radial-gradient(circle at 35% 30%, #FF9CC0, var(--rose) 60%, var(--velvet)); color: #fff;
  font-family: var(--font-display); font-weight: 600; font-size: 17px; display: flex; flex-direction: column; align-items: center; justify-content: center;
  box-shadow: 0 6px 0 var(--velvet-deep), 0 0 0 10px rgba(240, 108, 155, .15);
}
.mic .ic { font-size: 46px; line-height: 1; }
.feel { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.feel button { border: 3px solid var(--line); background: var(--paper); border-radius: 22px; padding: 14px 6px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-family: var(--font-display); font-weight: 600; font-size: 18px; box-shadow: 0 4px 0 var(--line); }
.feel button .ic { font-size: 50px; line-height: 1; }
.feel button.yes { border-color: var(--mint); box-shadow: 0 4px 0 var(--mint); }

/* ---------- path / puzzle / next ---------- */
.lvl { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.lvl button { border: 2px solid var(--line); background: var(--paper); border-radius: 14px; padding: 8px 2px; font-weight: 800; font-size: 13px; line-height: 1.15; }
.lvl button.on { background: var(--sky); border-color: var(--sky); color: #fff; }
.lvl button .d { display: block; font-size: 15px; }
.trail { display: flex; flex-direction: column; gap: 8px; }
.tcard { display: grid; grid-template-columns: 56px 1fr; gap: 10px; align-items: center; border: 2px solid var(--line); border-radius: 16px; padding: 8px 10px; background: var(--bg); transition: transform .15s, border-color .15s; min-width: 0; }
.tcard .pic { font-size: 38px; text-align: center; line-height: 1; }
.tcard .txt { min-width: 0; }
.tcard .txt .z { font-family: var(--font-zh); font-weight: 700; font-size: 20px; line-height: 1.25; overflow-wrap: anywhere; }
.tcard .txt .p { font-family: var(--font-py); font-size: 14px; color: var(--muted); overflow-wrap: anywhere; }
.tcard.q .pic { color: var(--muted); font-family: var(--font-display); font-weight: 700; }
.tcard.now { border-color: var(--velvet); transform: scale(1.03); background: #FCE6F0; }
.spot { height: 200px; border-radius: 22px; background: radial-gradient(ellipse 50% 70% at 50% 100%, #FFE9A8 0%, #F4B740 30%, transparent 70%), var(--stage); display: grid; place-items: center; font-size: 72px; }
.slots { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.slot { aspect-ratio: 1; border-radius: 16px; border: 2.5px dashed var(--line); display: grid; place-items: center; font-size: 30px; position: relative; background: var(--paper); max-width: 100%; }
.slot .n { position: absolute; top: 3px; left: 7px; font-size: 12px; font-weight: 800; color: var(--muted); }
.slot.filled { border-style: solid; border-color: var(--mint); background: #E6F7F3; animation: popin .35s cubic-bezier(.3, 1.6, .5, 1); }
.pieces { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.piece { aspect-ratio: 1; border-radius: 16px; border: 2px solid var(--line); background: var(--paper); font-size: 34px; box-shadow: 0 4px 0 var(--line); max-width: 100%; }
.piece.gone { visibility: hidden; }
.piece.hint { border-color: var(--gold); box-shadow: 0 0 0 4px var(--gold-soft), 0 4px 0 var(--gold); }
.wiggle { animation: wiggle .4s ease; }
@keyframes wiggle { 25% { transform: rotate(-8deg); } 75% { transform: rotate(8deg); } }
.opts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.opt { aspect-ratio: 1; border-radius: 20px; border: 2px solid var(--line); background: var(--paper); font-size: 44px; box-shadow: 0 4px 0 var(--line); max-width: 100%; }
.opt.no { opacity: .3; pointer-events: none; }
.opt.yes { border-color: var(--mint); background: #E6F7F3; }
.dots { display: flex; gap: 6px; justify-content: center; }

function point(el) {
  document.querySelectorAll('.go').forEach(e => e.classList.remove('go'));
  if (el) { el.classList.add('go'); setTimeout(() => { try { const r = el.getBoundingClientRect(); if (r.top < 70 || r.bottom > innerHeight - 170) el.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (e) {} }, 60); }
}

/* ======================= listening (speech recognition) ======================= */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let micMode = SR ? (S.micOk ? 'ok' : 'unknown') : 'none';   // 'ok' | 'unknown' | 'none'
let liveListener = null;
const FATAL = ['not-allowed', 'service-not-allowed', 'audio-capture', 'language-not-supported'];
function listen(onText) {
  let prev = '', sess = '', active = true, rec = null, fatal = null, finished = false, resolveEnd, starts = 0;
  const done = new Promise(r => resolveEnd = r);
  const finish = () => { if (finished) return; finished = true; active = false; clearTimeout(cap); if (liveListener === api) liveListener = null; resolveEnd({ text: prev + sess, fatal }); };
  const spawn = () => {
    rec = new SR();
    rec.lang = 'zh-CN'; rec.continuous = true; rec.interimResults = true; rec.maxAlternatives = 1;
    rec.onresult = e => { let t = ''; for (let i = 0; i < e.results.length; i++) t += e.results[i][0].transcript; sess = t; onText && onText(prev + sess); };
    const first = starts === 0;
    rec.onerror = e => { micLogAdd('error: ' + e.error + (first ? '' : ' (restart)')); if (first && FATAL.includes(e.error)) fatal = e.error; else if (!first && FATAL.includes(e.error)) active = false; };
    rec.onend = () => {
      prev += sess; sess = '';
      if (active && !fatal) { setTimeout(() => { if (!active) return finish(); try { spawn(); } catch (err) { finish(); } }, 120); }
      else finish();
    };
    try { rec.start(); starts++; } catch (err) { micLogAdd('start failed: ' + (err && err.name)); if (!starts) fatal = fatal || 'start'; finish(); }
  };
  const stop = () => { active = false; try { rec && rec.stop(); } catch (e) {} setTimeout(finish, 2500); };
  const abort = () => { active = false; try { rec && rec.abort(); } catch (e) {} finish(); };
  const cap = setTimeout(stop, 90000);   // never rush her: only a 90-second safety stop
  const api = { stop, abort, done };
  liveListener = api;
  spawn();
  return api;
}
function abortListening() { if (liveListener) { liveListener.abort(); try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {} } }
const micLog = [];
function micLogAdd(t) { micLog.unshift(new Date().toLocaleTimeString() + ' · ' + t); micLog.length = Math.min(micLog.length, 12); }
let emptyHears = 0;

/* ======================= matching what Adee said ======================= */
const PYMAP = DATA.pymap;
const DIGIT = { 0: '零', 1: '一', 2: '二', 3: '三', 4: '四', 5: '五', 6: '六', 7: '七', 8: '八', 9: '九' };
const fz = s => s.replace(/^zh/, 'z').replace(/^ch/, 'c').replace(/^sh/, 's').replace(/^l/, 'n').replace(/ing$/, 'in').replace(/eng$/, 'en').replace(/v/g, 'u');
const toneless = p => p.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/ü/g, 'v').toLowerCase();
function targetOf(chunks) { return chunks.flatMap(c => c.toks.map((t, i) => t === 'Barnum' ? '#barnum' : fz(toneless(c.pys[i])))); }
function heardOf(text) {
  text = (text || '').replace(/[0-9]/g, d => DIGIT[d]);
  const toks = text.match(/[一-鿿]|[A-Za-z]+/g) || [];
  return toks.map(t => /[A-Za-z]/.test(t) ? ['#en'] : (PYMAP[t] ? PYMAP[t].split('|').map(fz) : ['?']));
}
const BARNUM_LIKE = ['#en', 'ba', 'bo', 'pa', 'ban', 'bai', 'bei', 'bu', 'ma', 'na'];
function eqSyl(t, h) { return t === '#barnum' ? h.some(x => BARNUM_LIKE.includes(x)) : h.includes(t); }
/* longest common subsequence: which target syllables did she say, in order */
function matchSyl(tgt, heard) {
  const n = tgt.length, m = heard.length;
  const dp = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
    dp[i][j] = eqSyl(tgt[i], heard[j]) ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
  const ok = new Array(n).fill(false);
  let i = 0, j = 0;
  while (i < n && j < m) {
    if (eqSyl(tgt[i], heard[j]) && dp[i][j] === dp[i + 1][j + 1] + 1) { ok[i] = true; i++; j++; }
    else if (dp[i + 1][j] >= dp[i][j + 1]) i++; else j++;
  }
  return { ok, score: n ? ok.filter(Boolean).length / n : 0, heardCount: m };
}

/* ======================= the microphone button ======================= */
let recCount = 0;
/* Renders the mic into `host`. Resolves after Adee presses it twice:
   { text, ok, score, heardCount, fatal }  — or null if she left the screen. */
function micTurn(host, tgt, onLive) {
  const rid = routeId;
  host.innerHTML = `<div class="micwrap"><button class="mic" id="micBtn" aria-label="Microphone"><span class="ic">🎤</span><span class="lb">Press to talk</span></button>
    <div class="listening" hidden><span class="eq"><i></i><i></i><i></i><i></i></span> I'm listening… take your time</div></div>`;
  const b = host.querySelector('#micBtn'), lst = host.querySelector('.listening');
  /* the mic stays locked while Jenny is talking, so the phone never has to listen and speak at once */
  const lock = () => { b.disabled = true; b.classList.add('wait'); b.classList.remove('go'); b.querySelector('.ic').textContent = '👂'; b.querySelector('.lb').textContent = 'Listen to Jenny'; };
  const unlock = () => { b.disabled = false; b.classList.remove('wait'); b.querySelector('.ic').textContent = '🎤'; b.querySelector('.lb').textContent = 'Press to talk'; point(b); };
  lock();
  let quietFor = 0;
  const watch = setInterval(() => {
    if (rid !== routeId || !b.isConnected) return clearInterval(watch);
    const busy = !!pending || (!voice.paused && !voice.ended);
    quietFor = busy ? 0 : quietFor + 1;
    if (quietFor >= 3) { clearInterval(watch); unlock(); }
  }, 150);
  return new Promise(resolve => {
    let L = null;
    b.addEventListener('click', () => {
      if (b.classList.contains('wait')) return;
      if (!L) {
        stopAll(); recCount++;
        try { if (navigator.audioSession) navigator.audioSession.type = 'play-and-record'; } catch (e) {}
        b.classList.add('rec'); b.querySelector('.ic').textContent = '⏹'; b.querySelector('.lb').textContent = 'Press when finished';
        lst.hidden = false; point(b);
        L = listen(t => { if (rid === routeId && onLive) onLive(matchSyl(tgt, heardOf(t))); });
        L.done.then(async r => {
          /* hand the phone back to loud playback, and give it a moment to switch before Jenny speaks */
          try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
          await sleep(700);
          if (rid !== routeId) return resolve(null);
          b.classList.remove('rec'); lst.hidden = true;
          const res = Object.assign({ text: r.text, fatal: r.fatal }, matchSyl(tgt, heardOf(r.text)));
          if (r.fatal) { micMode = 'none'; S.micOk = 0; save(); micLogAdd('mic unavailable: ' + r.fatal); }
          else if (res.heardCount) { emptyHears = 0; micLogAdd('heard: ' + r.text.slice(0, 40)); if (micMode !== 'ok') { micMode = 'ok'; S.micOk = 1; save(); } }
          else {
            emptyHears++; micLogAdd('heard nothing');
            if (emptyHears >= 3) { emptyHears = 0; micMode = 'none'; res.fatal = 'quiet'; }
          }
          resolve(res);
        });
      } else {
        b.disabled = true; b.classList.remove('go');
        b.querySelector('.ic').textContent = '⭐'; b.querySelector('.lb').textContent = 'Checking…';
        L.stop();
      }
    });
  });
}
function micInstr() { return recCount < 3 ? null : 'mic_short'; }

/* shows which syllables she said: green = heard, grey = still to practise */
function paintSyl(ok, final) {
  const syls = [...document.querySelectorAll('#phrase .syl')];

}

  const turnSolo = async () => {
    if (!alive()) return;
    if (micMode === 'none') {
      $('#micHost').innerHTML = `<button class="btn velvet wide" id="pCheck">✅ Check</button>`;
      point($('#pCheck'));
      on('#pCheck', async () => {
        point(null); $('#micHost').innerHTML = '';
        if (!(await say('check'))) return;
        if (!(await karaoke(c, 'c' + c.n))) return;
        $('#phrase').classList.remove('hidden');
        $('#micHost').innerHTML = yesNoHTML();
        on('#fYes', (e) => { $('#feel').style.pointerEvents = 'none'; success(e.currentTarget); });
        on('#fNo', async (e) => {
          $('#feel').style.pointerEvents = 'none'; mark('c' + c.n);
          const extra = sparkle(e.currentTarget);
          if (!(await sayAll([pickFresh('almost', ['almost1', 'almost2', 'almost3']), ...extra]))) return;
          if (alive()) drawSolo();
        });
      });
      return;
    }
    const pr = micTurn($('#micHost'), tgt, r => paintSyl(r.ok));
    if (tries > 0) say(micInstr() || 'mic_short');
    const r = await pr; if (!r) return;
    if (r.fatal) { micFellBack(); return turnSolo(); }
    if (!r.heardCount) { if (!(await say('heard_none'))) return; return turnSolo(); }
    $('#phrase').classList.remove('hidden');
    paintSyl(r.ok, true);
    $('#micHost').innerHTML = '';
    if (r.score >= .75) return success($('#phrase'));
    tries++;
    mark('c' + c.n);
    const extra = sparkle($('#phrase'));
    if (tries >= 3) {
      const ex2 = award(1, $('#phrase'));
      if (!(await sayAll(['brave', ...extra, ...ex2]))) return;
      if (alive()) drawDone(true);
      return;
    }
    if (!(await sayAll([r.score >= .4 ? 'heard_close' : 'heard_low', ...extra]))) return;
    if (!(await karaoke(c, 'c' + c.n + (r.score >= .4 ? '' : 's')))) return;
    paintSyl(r.ok, true);
    await sleep(300);
    turnSolo();
  };

  const drawDone = (again) => {
    const nx = nextPhrase();
    const help = document.getElementById('soloHelp'); if (help) help.remove();
    const host = document.getElementById('micHost');
    const box = h('div', { class: 'row acts' });
    box.innerHTML = `${again ? '<button class="btn ghost" id="dAgain">🔁 Again</button>' : ''}${nx ? `<button class="btn gold" id="dNext">Next ›</button>` : `<button class="btn gold" id="dPath">🛤️ Whole line</button>`}<button class="btn ghost" id="dMap">🗺️ My lines</button>`;
    if (host) host.replaceWith(box); else V().querySelector('.card').appendChild(box);
    point($('#dNext') || $('#dPath'));
    on('#dAgain', () => drawListen());
    on('#dNext', () => route('practice', Object.assign({}, p, { n: nx, step: 'listen' })));
    on('#dPath', () => route('path', { li: c.li, backTo: 'map' }));
    on('#dMap', () => route('map'));
  };

  ({ listen: drawListen, echo: drawEcho, solo: drawSolo })[step]();
};

/* --- Picture path: the whole line, with fewer clues each level --- */
VIEWS.path = (p) => {
  const li = p.li; const L = LINES[li]; const cs = lineChunks(li);
  const rid = routeId;
  const tgt = targetOf(cs);
  const bounds = []; { let a = 0; cs.forEach(c => { bounds.push([a, a + c.toks.length]); a += c.toks.length; }); }
  setWhere(`Picture path · ${L.title}`);
  const done = S.path[li] || [];
  let lv = p.lv || Math.min(4, (done.length ? Math.max(...done) + 1 : 1));
  let tries = 0;
  const paintCards = (ok, final) => bounds.forEach(([a, b], k) => {
    const part = ok.slice(a, b), sc = part.filter(Boolean).length / part.length;
    const card = document.querySelector(`.tcard[data-k="${k}"]`); if (!card) return;
    card.classList.toggle('ok', sc >= .6);
    card.classList.toggle('miss', !!final && sc < .6);
    if (sc >= .6 && card.classList.contains('q')) { card.classList.remove('q'); card.querySelector('.pic').textContent = cs[k].pic; }
  });
  const draw = () => {
    tries = 0;
    V().innerHTML = `<section class="card">
      <div class="eyebrow">Line ${li + 1} · ${L.moodEmoji} ${L.title}</div>
      <div class="lvl">${[['📝', 'Words'], ['🖼️', 'Pictures'], ['1️⃣', 'First one'], ['🔦', 'Spotlight']].map(([d, t], k) => `<button data-lv="${k + 1}" class="${lv === k + 1 ? 'on' : ''}"><span class="d">${(done.includes(k + 1) ? '⭐' : d)}</span>${t}</button>`).join('')}</div>
      <div id="micHost" class="acts"></div>
      <div class="trail">${cs.map((c, k) => {
        const showPic = lv <= 2 || k === 0;
        return `<div class="tcard${showPic ? '' : ' q'}${lv === 4 ? ' dark' : ''}" data-k="${k}"><div class="pic">${lv === 4 ? (k === 0 ? L.moodEmoji : '') : (showPic ? c.pic : '?')}</div><div class="txt">${lv === 1 ? `<div class="p">${c.pys.join(' ')}</div><div class="z">${c.zh}</div>` : `<div class="p">${showPic && lv < 4 ? '“' + c.en + '”' : ''}</div>`}</div></div>`;
      }).join('')}</div>
      <p class="move" style="font-size:16px">${L.moodText}</p>
      <div class="row acts"><button class="btn ghost" id="hear">▶ Listen to the whole line</button></div>
    </section>`;
    document.querySelectorAll('.lvl button').forEach(b => b.addEventListener('click', () => { lv = +b.dataset.lv; stopAll(); abortListening(); draw(); }));
    on('#hear', () => playLine(false));
    turn(true);
  };
  const win = async (el) => {
    S.path[li] = Array.from(new Set([...(S.path[li] || []), lv])); mark('path' + li);
    const extra = award(2, el); confetti(50);
    if (!(await sayAll([pickFresh('good', ['good1', 'good2', 'good4', 'good5']), ...extra]))) return;
    if (await checkMission()) { route('home'); return; }
    await maybeRest();
    if (rid !== routeId) return;
    if (lv < 4) lv++;
    draw();
  };
  async function turn(first) {
    if (rid !== routeId) return;
    if (micMode === 'none') {
      $('#micHost').innerHTML = `<button class="btn velvet wide" id="check">✅ Check</button>`;
      point($('#check'));
      if (first) say('path');
      on('#check', async () => {
        point(null); $('#micHost').innerHTML = '';
        if (!(await say('check'))) return;
        if (!(await playLine(true))) return;
        $('#micHost').innerHTML = yesNoHTML();
        on('#fYes', (e) => { $('#feel').style.pointerEvents = 'none'; win(e.currentTarget); });
        on('#fNo', async (e) => {
          $('#feel').style.pointerEvents = 'none'; mark('path' + li);
          const extra = sparkle(e.currentTarget);
          if (!(await sayAll([pickFresh('almost', ['almost1', 'almost2', 'almost3']), ...extra]))) return;
          if (rid !== routeId) return;
          if (lv > 1) lv--; draw();
        });
      });
      return;
    }
    const pr = micTurn($('#micHost'), tgt, r => paintCards(r.ok));
    say(first ? 'path' : (micInstr() || 'mic_short'));
    const r = await pr; if (!r) return;
    if (r.fatal) { micFellBack(); return turn(true); }
    if (!r.heardCount) { if (!(await say('heard_none'))) return; return turn(false); }
    paintCards(r.ok, true);
    $('#micHost').innerHTML = '';
    if (r.score >= .7) return win($('.trail'));
    tries++; mark('path' + li);
    const extra = sparkle($('.trail'));
    if (tries >= 3) {
      const ex2 = award(1, $('.trail'));
      if (!(await sayAll(['brave', ...extra, ...ex2]))) return;
      if (rid !== routeId) return;
      if (lv > 1) lv--; draw(); return;
    }
    if (!(await sayAll([r.score >= .4 ? 'heard_close' : 'heard_low', ...extra]))) return;
    if (!(await playLine(true))) return;
    paintCards(r.ok, true);
    turn(false);
  }
  async function playLine(reveal) {
    for (let k = 0; k < cs.length; k++) {
      document.querySelectorAll('.tcard').forEach(e => e.classList.toggle('now', +e.dataset.k === k));
      const card = document.querySelector(`.tcard[data-k="${k}"]`);
      if (reveal && card && card.classList.contains('q')) { card.classList.remove('q'); card.querySelector('.pic').textContent = cs[k].pic; }
      if (!(await play('c' + cs[k].n))) return false;
      await sleep(220);
    }
    document.querySelectorAll('.tcard').forEach(e => e.classList.remove('now'));
    return true;
  }
  draw();
};

/* --- What comes next? The phone checks this one --- */
VIEWS.next = (p) => {
  const li = p.li; const cs = lineChunks(li); const L = LINES[li];
  setWhere("What's next? · " + L.title);
  let k = 0, wrong = 0;
  const draw = async (intro) => {
    const curC = cs[k], ans = cs[k + 1];
    const pool = CHUNKS.filter(c => c.n !== ans.n && c.n !== curC.n);
    const same = pool.filter(c => c.li === li), other = pool.filter(c => c.li !== li);
    const ds = [];
    while (ds.length < 2) { const src = (same.length ? same : other); const c = src.splice(Math.floor(Math.random() * src.length), 1)[0]; if (c && !ds.some(d => d.pic === c.pic) && c.pic !== ans.pic) ds.push(c); }
    const opts = [ans, ...ds].sort(() => Math.random() - .5);
    V().innerHTML = `<section class="card">
      <div class="dots">${cs.slice(1).map((_, i) => `<i class="${i < k ? 'on' : ''}"></i>`).join('')}</div>
      <div class="tcard now" style="transform:none"><div class="pic">${curC.pic}</div><div class="txt"><div class="z">${curC.zh}</div><div class="p">${curC.pys.join(' ')}</div></div></div>
      <button class="btn ghost" id="nHear">▶ Hear it again</button>
      <h2 style="text-align:center">What comes next?</h2>
      <div class="opts">${opts.map(o => `<button class="opt" data-n="${o.n}">${o.pic}</button>`).join('')}</div>
    </section>`;
    on('#nHear', () => play('c' + curC.n));
    document.querySelectorAll('.opt').forEach(b => b.addEventListener('click', async () => {
      if (+b.dataset.n === ans.n) {
        document.querySelectorAll('.opt').forEach(o => o.style.pointerEvents = 'none');
        b.classList.add('yes'); sfx('sfx_sparkle');
        if (!(await say('next_yes'))) return;
        if (!(await play('c' + ans.n))) return;
        k++;
        if (k >= cs.length - 1) {
          S.games['next' + li] = 1; mark('next' + li);
          confetti(60);
          const extra = award(2, b);
          if (!(await sayAll(['next_done', ...extra]))) return;
          if (await checkMission()) { route('home'); return; }
          await maybeRest();
          V().innerHTML = `<section class="card" style="align-items:center;text-align:center"><div class="bigpic pop">🔮</div><h2>You know the whole line!</h2><div class="row" style="width:100%"><button class="btn gold" id="again">Play again</button><button class="btn ghost" id="home">🏠 Home</button></div></section>`;
          on('#again', () => route('next', p)); on('#home', () => route('home'));
          return;
        }
        draw(false);
      } else {
        b.classList.add('wiggle', 'no'); sfx('sfx_boop'); wrong++;
        say('next_no');
      }
    }));
    if (intro) { if (!(await say('next_q'))) return; }
    await play('c' + curC.n);
  };
  draw(true);
};

      <li>A 👆 hand always points at the next thing to press. Pressing Jenny's face at the bottom makes her repeat what she said.</li>
    </ul></section>
  <section class="card prose"><div class="eyebrow">Microphone</div><h2>Getting Jenny to hear Adee</h2>
    <ul>
      <li>Open the link in <b>Safari</b> on iPhone or <b>Chrome</b> on Android, not inside another app.</li>
      <li>Press <b>Allow</b> when the phone asks to use the microphone.</li>
      <li>On iPhone, if Jenny can't hear her, check that Siri or Dictation is turned on in Settings.</li>
      <li>The listening uses the phone's own speech service (Apple or Google). Nothing is recorded or saved by this page.</li>
      <li>If the microphone can't be used, the game still works. Jenny plays the right answer and Adee presses Yes or No.</li>
    </ul>
    <p style="margin:0;font-weight:700">Microphone right now: ${micMode === 'ok' ? '✅ Jenny can hear' : micMode === 'none' ? '⛔ Off. Adee will press Yes or No' : '❔ Not tested yet'}</p>
    <button class="btn ghost" id="micTest">🎤 Test the microphone</button>
    ${micLog.length ? `<details><summary style="font-weight:800;cursor:pointer">What Jenny heard today</summary><ul style="font-size:13px;margin-top:8px">${micLog.map(l => `<li>${l.replace(/</g, '&lt;')}</li>`).join('')}</ul></details>` : ''}</section>
  <section class="card"><div class="eyebrow">Your prize</div><h2>Turn stars into a real treat</h2>
    <div class="goalrow"><label class="field">Stars<input id="goal" type="number" min="5" max="500" inputmode="numeric" value="${S.goal || 30}"></label><label class="field">Prize<input id="reward" type="text" maxlength="40" placeholder="e.g. ice cream date"></label></div>
    <button class="btn" id="saveReward">Save prize</button>
    <p class="muted" style="margin:0;font-size:14px">The prize shows on Adee's home screen with a progress bar, and Jenny announces it when she gets there.</p></section>
  <section class="card"><div class="eyebrow">The 22-day plan</div>
    <div style="overflow-x:auto"><table class="plan">${PLAN.map(pl => `<tr class="${td >= pl[0] && td <= pl[1] ? 'today' : ''}"><td>${fmtDay(pl[0]).replace(/^\w+ /, '')}${pl[1] !== pl[0] ? '–' + fmtDay(pl[1]).replace(/^\w+ /, '') : ''}</td><td><b>${pl[2]}</b><br>${pl[3].map(t => t.t === 'chunks' ? `Phrases ${t.a}–${t.b}` : t.t === 'story' ? 'Story time' : t.t === 'stage' ? 'Big Stage' : t.t === 'path' ? 'Picture path' : t.t === 'next' ? "What's next?" : 'Puzzle').join(' · ')}</td></tr>`).join('')}</table></div></section>
  <section class="card prose"><div class="eyebrow">Good to know</div>
    <ul>
      <li>Turn the volume up. If you hear nothing, check that the phone isn't on silent.</li>
      <li>“Barnum” is said in English, the same way it's written in the script.</li>
      <li>Press any word in a phrase to hear just that word. 🐢 plays it slowly.</li>
      <li>Big Stage plays the cues from the script: everyone says 致 Barnum, Barnum says 谢谢 and 为什么, so she learns when to speak.</li>
      <li>Progress is saved on this phone in this browser. On iPhone it's safest to add the game to your Home Screen: in Safari press Share, then <b>Add to Home Screen</b>, and always open it from that icon. Opening the link from WhatsApp or in a Private tab uses a separate, temporary memory.</li>
    </ul></section>
  <section class="card" id="resetBox"><div class="eyebrow">Start over</div><button class="btn ghost" id="reset">Reset all progress</button></section>`;
  $('#reward').value = S.reward || '';
  on('#micTest', () => { micMode = SR ? 'unknown' : 'none'; route('miccheck', { backTo: 'grown' }); });
  on('#saveReward', () => { S.reward = $('#reward').value.trim(); S.goal = Math.max(5, Math.min(500, parseInt($('#goal').value, 10) || 30)); S.met = S.stars >= S.goal && S.reward ? 1 : 0; save(); toast('🎁', S.reward ? 'Prize saved' : 'Prize cleared'); });
  on('#reset', () => {
    $('#resetBox').innerHTML = `<div class="confirm"><b>Erase all of Adee's stars, stickers and costume?</b><div class="row"><button class="btn ghost" id="rNo">Keep them</button><button class="btn velvet" id="rYes">Erase</button></div></div>`;
    on('#rNo', () => route('grown'));
    on('#rYes', () => { const keep = { reward: S.reward, goal: S.goal, micOk: S.micOk }; S = Object.assign(fresh(), keep); save(); renderPurse(); toast('🧹', 'Progress erased'); route('home'); });
  });
};
